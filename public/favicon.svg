<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="magnetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background App Icon Badge -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="4" y="4" width="56" height="56" rx="12" fill="none" stroke="url(#magnetGrad)" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Vertical 9:16 Smartphone Screen Frame -->
  <rect x="22" y="10" width="20" height="44" rx="4" fill="#090D16" stroke="url(#goldGrad)" stroke-width="1.8" filter="url(#glow)"/>
  
  <!-- Screen safe zones (subtle indicator) -->
  <line x1="24" y1="17" x2="40" y2="17" stroke="#FDE047" stroke-width="0.8" stroke-dasharray="2,2" stroke-opacity="0.6"/>
  <line x1="24" y1="47" x2="40" y2="47" stroke="#FDE047" stroke-width="0.8" stroke-dasharray="2,2" stroke-opacity="0.6"/>

  <!-- Horseshoe Magnet Intertwined -->
  <path d="M12 28 C12 44, 52 44, 52 28" fill="none" stroke="url(#magnetGrad)" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Magnet North/South Silver/Gold Tips -->
  <rect x="9.5" y="22" width="5" height="7" rx="1" fill="#F8FAFC"/>
  <rect x="49.5" y="22" width="5" height="7" rx="1" fill="url(#goldGrad)"/>

  <!-- Energy Sparks & Magnetic Rays -->
  <circle cx="12" cy="18" r="1.5" fill="#FDE047"/>
  <circle cx="52" cy="18" r="1.5" fill="#10B981"/>
  <path d="M32 24 L33.5 29 L38.5 30.5 L33.5 32 L32 37 L30.5 32 L25.5 30.5 L30.5 29 Z" fill="url(#goldGrad)"/>
</svg>
